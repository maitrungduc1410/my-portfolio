# Publishes ducmai.me to GitHub Pages.
#
# THE PUBLISH BOUNDARY, which is the part of this file worth reading twice.
#
# This workflow never uploads the repository root, and it does not upload the
# build output blindly either. Astro builds into dist/, and dist/ is copied
# into a staging directory only after every file in it has matched an
# allowlist of web asset types. The list is an allowlist rather than a set of
# exclusions, because an exclusion list publishes everything added after it was
# written, and a build accumulates source maps, stray notes and copied
# fixtures whether or not anyone planned for it.
#
# A file type that is not named in PUBLISH_PATTERNS fails the build instead of
# shipping. Widening the list is a decision somebody makes on purpose, in this
# file, in review.
#
# What gets built: a static Astro site in two locales (/ and /vi/). The
# build also fetches public GitHub, npm and Viblo numbers; when a source is
# unreachable it falls back to the snapshot committed in src/data, so a flaky
# API delays nothing and never breaks the page.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Read-only by default. The deploy job below adds the two permissions that
# GitHub Pages requires, and no job holds a permission it does not use.
permissions:
  contents: read

# One deployment at a time, and queued runs wait their turn instead of being
# cancelled. Cancelling mid-deploy is how a site ends up half updated.
concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # THE ALLOWLIST. Whitespace-separated shell globs, matched against the path
  # of every file in dist/ relative to dist/. Everything that reaches ducmai.me
  # matches one of these. Nothing else ships.
  #
  # CUSTOM DOMAIN: ducmai.me is set once in Settings then Pages, and for an
  # Actions deployment that setting is the single source of truth for the
  # domain. No CNAME file is committed, deliberately, so there is nothing that
  # can disagree with it. If you would rather keep the domain in version
  # control, put a CNAME file containing exactly ducmai.me in public/ and add
  # CNAME to this list, then remove the domain from the settings form so the
  # two cannot drift apart. Getting it wrong is not a soft failure: a CNAME
  # naming a host that DNS does not point at takes the site off the air at the
  # custom domain, and the TLS certificate for the wrong name cannot be issued,
  # so visitors see a certificate warning rather than a 404.
  PUBLISH_PATTERNS: >-
    *.html _astro/*.js _astro/*.css fonts/*.woff2 og/*.jpg *.svg *.webp
    apple-touch-icon.png
    sitemap.xml robots.txt
  # Files that must exist in every build. og/*.jpg are the social cards named
  # by absolute URL in the og:image tags, so a missing one renders an empty
  # card on every shared link rather than failing anywhere visible.
  REQUIRED_FILES: >-
    index.html vi/index.html 404.html sitemap.xml robots.txt
    og/en.jpg og/vi.jpg apple-touch-icon.png

jobs:
  build:
    name: Build and stage the publishable files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages only reads the Pages configuration here. Write access
      # would be needed to have it switch Pages on for the repository, which is
      # a one-time click that is better done deliberately in the settings.
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # This job never pushes, so it has no reason to leave a credential
          # behind in the local git config where later steps could read it.
          persist-credentials: false

      - name: Read the Pages configuration
        uses: actions/configure-pages@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build
        env:
          # Only raises the GitHub API rate limit for the public stats fetch.
          # The token is read-only (contents: read) and is never written out.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Stage only allowlisted files
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rejected=0
          while IFS= read -r -d '' path; do
            rel=${path#dist/}
            ok=0
            # Unquoted on purpose: PUBLISH_PATTERNS is a list of globs and word
            # splitting is how it is read. set -f stops the shell expanding the
            # globs against the working directory.
            set -f
            for pat in $PUBLISH_PATTERNS; do
              # shellcheck disable=SC2254
              case "$rel" in $pat) ok=1; break ;; esac
            done
            set +f
            if [ "$ok" = 1 ]; then
              install -D -m 644 "$path" "_site/$rel"
            else
              echo "::error::not in the publish allowlist: $rel"
              rejected=1
            fi
          done < <(find dist -type f -print0)
          [ "$rejected" = 0 ] || exit 1
          echo "Staged for publication:"
          find _site -type f | sort

      - name: Verify the staged site
        run: |
          set -euo pipefail
          for f in $REQUIRED_FILES; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::required file is missing from the build: $f"
              exit 1
            fi
          done
          # The allowlist above already excludes these, so this second check is
          # redundant by design. It is here because it states the boundary in
          # the terms that actually matter, and it fails loudly if someone ever
          # widens the allowlist without thinking it through.
          # Markdown here is working material, the README included, so no .md
          # file and nothing under a docs/ path is publishable. Source maps
          # would publish the unminified source next to the bundle. If that
          # ever stops being true for one specific file, change this check on
          # purpose rather than widening it.
          if find _site \( -name '*.md' -o -name '*.map' -o -path '*docs*' \) -print | grep -q .; then
            echo "::error::markdown, a source map or a docs/ path reached the staging directory. None of them is web content in this repository."
            exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Create the Pages deployment.
      pages: write
      # Let deploy-pages prove to Pages that the artifact came from this run.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@v5